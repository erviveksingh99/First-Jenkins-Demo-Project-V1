<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jenkins Demo</title>
    <style>
        body { font-family: Arial, sans-serif; text-align: center; margin-top: 60px; }
        button { padding: 10px 20px; margin: 5px; font-size: 16px; cursor: pointer; }
        #clock { font-size: 20px; color: #555; margin: 15px 0; }
        #counter { font-size: 28px; font-weight: bold; margin: 15px 0; }
        #status { margin-top: 20px; font-size: 18px; }
    </style>
</head>
<body>
    <h1 id="title">Hello from Jenkins! Version 5</h1>

    <div id="clock"></div>

    <div id="counter">0</div>
    <button id="incBtn">Increase</button>
    <button id="decBtn">Decrease</button>
    <button id="resetBtn">Reset</button>

    <div>
        <button id="colorBtn">Change Color</button>
        <button id="pipelineBtn">Run Pipeline Demo</button>
    </div>

    <div id="status"></div>

    <script>
        // 1. Live clock
        function updateClock() {
            document.getElementById('clock').textContent =
                'Time: ' + new Date().toLocaleTimeString();
        }
        updateClock();
        setInterval(updateClock, 1000);

        // 2. Counter
        let count = 0;
        const counterEl = document.getElementById('counter');
        function render() { counterEl.textContent = count; }

        document.getElementById('incBtn').addEventListener('click', () => { count++; render(); });
        document.getElementById('decBtn').addEventListener('click', () => { count--; render(); });
        document.getElementById('resetBtn').addEventListener('click', () => { count = 0; render(); });

        // 3. Random color on heading
        document.getElementById('colorBtn').addEventListener('click', () => {
            const colors = ['#e74c3c', '#3498db', '#2ecc71', '#f39c12', '#9b59b6'];
            document.getElementById('title').style.color =
                colors[Math.floor(Math.random() * colors.length)];
        });

        // 4. Pipeline flow simulation: Checkout -> Validate -> Deploy
        document.getElementById('pipelineBtn').addEventListener('click', async () => {
            const status = document.getElementById('status');
            const stages = ['Checkout', 'Validate', 'Deploy'];
            const wait = ms => new Promise(r => setTimeout(r, ms));

            for (const stage of stages) {
                status.textContent = '⏳ ' + stage + ' running...';
                await wait(1000);
                status.textContent = '✅ ' + stage + ' done';
                await wait(500);
            }
            status.textContent = '🎉 Pipeline finished: SUCCESS';
    //    });
    </script>
</body>
</html>
